/**
 * system.service.proto
 * ─────────────────────────────────────────────────────────
 * gRPC Service: Health check, Cấu hình hệ thống, Xác thực
 * ─────────────────────────────────────────────────────────
 */

syntax = "proto3";

package mc_server;

import "common.types.proto";

service SystemService {
  // Health check hệ thống
  rpc GetHealth (GetHealthRequest) returns (GetHealthResponse);
  
  // Lấy cấu hình server
  rpc GetConfig (GetConfigRequest) returns (ServerConfigInfo);
  
  // Cập nhật cấu hình
  rpc UpdateConfig (UpdateConfigRequest) returns (StatusResponse);
  
  // Bật/tắt simulation
  rpc ToggleSimulation (ToggleSimulationRequest) returns (ToggleSimulationResponse);
}

message GetHealthRequest {}

message GetHealthResponse {
  string status = 1;                 // HEALTHY | DEGRADED | UNHEALTHY
  string uptime = 2;
  int32  connected_devices = 3;
  int32  total_devices = 4;
  int32  active_alarms = 5;
  string oracle_itmdev_status = 6;
  string oracle_itmmes_status = 7;
  string oracle_itmvmes_status = 8;
  string oracle_itmvpackmes_status = 9;
  string oracle_gwdb_status = 10;
  MesStatusInfo mes_status = 11;
}

message GetConfigRequest {}

message ServerConfigInfo {
  // Server
  string instance_name = 1;
  int32  listen_port = 2;
  int32  max_concurrent_clients = 3;
  int32  buffer_size_limit_bytes = 4;
  int32  keepalive_interval_ms = 5;
  int32  watchdog_timeout_ms = 6;
  bool   auto_reconnect = 7;
  int32  reconnect_max_attempts = 8;
  
  // Protocol
  string default_boundary = 9;
  string checksum_algorithm = 10;
  
  // MES
  string mes_endpoint_url = 11;
  int32  mes_timeout_ms = 12;
  
  // Logging
  string log_level = 13;
  int32  log_retention_days = 14;
  bool   mask_sensitive_payloads = 15;
}

message UpdateConfigRequest {
  ServerConfigInfo config = 1;
}

message ToggleSimulationRequest {
  bool active = 1;
}

message ToggleSimulationResponse {
  bool is_simulating = 1;
}
